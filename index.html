<!DOCTYPE html>
<html id="html-tag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТАСКИ — Трекер задач и времени</title>
    <link rel="icon" type="image/svg+xml" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Crect width="64" height="64" rx="14" fill="%232563eb"/%3E%3Cpath d="M18 19h28v26H18z" fill="white" opacity=".96"/%3E%3Cpath d="M24 29l5 5 12-13" fill="none" stroke="%2310b981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/%3E%3Cpath d="M24 41h17" stroke="%232563eb" stroke-width="4" stroke-linecap="round"/%3E%3C/svg%3E'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.4/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./styles.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    borderRadius: { xl: '12px', lg: '8px' }
                }

</head>
<body class="bg-slate-200 dark:bg-zinc-900 text-slate-900 dark:text-zinc-100 min-h-screen transition-colors duration-300 pb-24 font-sans antialiased">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const months = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
        const dows = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
        const colorOrder = { red: 1, orange: 2, green: 3, blue: 4, default: 5 };

        const formatTimeInput = (raw) => {
            const digits = raw.replace(/\D/g, '').slice(0, 4);
            if (digits.length <= 2) return digits;
            return digits.slice(0, 2) + ':' + digits.slice(2);
        };

        const TimeInput = ({ value, onChange, className }) => {
            const handleKey = (e) => {
                if (e.key === 'Backspace' && value && value.endsWith(':')) {
                    e.preventDefault();
                    onChange(value.slice(0, -1));
                }
            };
            return (
                <input
                    type="text"
                    inputMode="numeric"
                    maxLength={5}
                    placeholder="--:--"
                    className={className}
                    value={value || ''}
                    onKeyDown={handleKey}
                    onChange={e => onChange(formatTimeInput(e.target.value))}
                />
            );
        };

        const toDateKey = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
        const todayKey = toDateKey(new Date());

        const DEFAULT_GIST_ID = 'e66de7295cfcb3a815f2530ae3a21e04';

        // Web Crypto AES-256-GCM + PBKDF2 Helpers
        async function deriveKey(password, salt) {
            const enc = new TextEncoder();
            const keyMaterial = await window.crypto.subtle.importKey(
                'raw',
                enc.encode(password),
                'PBKDF2',
                false,
                ['deriveKey']
            );
            return window.crypto.subtle.deriveKey(
                {
                    name: 'PBKDF2',
                    salt: salt,
                    iterations: 100000,
                    hash: 'SHA-256'
                },
                keyMaterial,
                { name: 'AES-GCM', length: 256 },
                false,
                ['encrypt', 'decrypt']
            );
        }

        async function encryptData(dataObj, password) {
            const enc = new TextEncoder();
            const plaintext = enc.encode(JSON.stringify(dataObj));
            const salt = window.crypto.getRandomValues(new Uint8Array(16));
            const iv = window.crypto.getRandomValues(new Uint8Array(12));
            const key = await deriveKey(password, salt);
            const ciphertext = await window.crypto.subtle.encrypt(
                { name: 'AES-GCM', iv: iv },
                key,
                plaintext
            );
            const toB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
            return {
                encrypted: true,
                version: 2,
                salt: toB64(salt),
                iv: toB64(iv),
                ciphertext: toB64(ciphertext)
            };
        }

        async function decryptData(encryptedObj, password) {
            const fromB64 = (str) => Uint8Array.from(atob(str), c => c.charCodeAt(0));
            const salt = fromB64(encryptedObj.salt);
            const iv = fromB64(encryptedObj.iv);
            const ciphertext = fromB64(encryptedObj.ciphertext);
            const key = await deriveKey(password, salt);
            const decrypted = await window.crypto.subtle.decrypt(
                { name: 'AES-GCM', iv: iv },
                key,
                ciphertext
            );
            const dec = new TextDecoder();
            return JSON.parse(dec.decode(decrypted));
        }

        function App() {
            const [data, setData] = useState({ tasks: [], work: {} });
            const [isEncrypted, setIsEncrypted] = useState(false);
            const [pendingContainer, setPendingContainer] = useState(null);
            const [masterPassword, setMasterPassword] = useState(() => sessionStorage.getItem('tracker_master_pass') || '');
            const [isLocked, setIsLocked] = useState(false);
            const [pinInput, setPinInput] = useState('');
            const [pinError, setPinError] = useState(false);
            const [newPassInput, setNewPassInput] = useState('');

            const [newTaskText, setNewTaskText] = useState({});
            const [editingId, setEditingId] = useState(null);
            const [editValue, setEditValue] = useState("");
            const [isDark, setIsDark] = useState(() => localStorage.getItem('theme') === 'dark');
            const [viewMode, setViewMode] = useState(() => localStorage.getItem('viewMode') || 'study');
            const [draggedTaskId, setDraggedTaskId] = useState(null);
            const [dropTarget, setDropTarget] = useState({ id: null, position: null });
            const [collapsedWeeks, setCollapsedWeeks] = useState({});
            const [expandedBreaks, setExpandedBreaks] = useState({});

            const [extraWeeks, setExtraWeeks] = useState(() => {
                const saved = localStorage.getItem('tracker_extra_weeks');
                return saved ? parseInt(saved, 10) : 0;
            });

            const [gistId, setGistId] = useState(() => localStorage.getItem('tracker_gist_id') || DEFAULT_GIST_ID);
            const [githubToken, setGithubToken] = useState(() => localStorage.getItem('tracker_gh_token') || '');
            const [syncStatus, setSyncStatus] = useState('local-only');
            const [syncError, setSyncError] = useState('');
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [copySuccess, setCopySuccess] = useState(false);

            // Pomodoro Focus Timer
            const [isPomodoroOpen, setIsPomodoroOpen] = useState(false);
            const [pomoTime, setPomoTime] = useState(25 * 60);
            const [pomoRunning, setPomoRunning] = useState(false);
            const [pomoMode, setPomoMode] = useState('work');

            useEffect(() => {
                let timer = null;
                if (pomoRunning && pomoTime > 0) {
                    timer = setInterval(() => setPomoTime(t => t - 1), 1000);
                } else if (pomoTime === 0 && pomoRunning) {
                    setPomoRunning(false);
                    alert(pomoMode === 'work' ? '🎉 Время фокуса завершено! Сделайте 5-минутный перерыв.' : '⏰ Перерыв окончен! Готовы снова к задачам?');
                    if (pomoMode === 'work') {
                        setPomoMode('break');
                        setPomoTime(5 * 60);
                    } else {
                        setPomoMode('work');
                        setPomoTime(25 * 60);
                    }
                }
                return () => clearInterval(timer);
            }, [pomoRunning, pomoTime, pomoMode]);

            useEffect(() => {
                try {
                    const hash = window.location.hash;
                    if (hash && hash.startsWith('#sync=')) {
                        const payload = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(hash.replace('#sync=', ''))))));
                        if (payload.gistId) {
                            setGistId(payload.gistId);
                            localStorage.setItem('tracker_gist_id', payload.gistId);
                        }
                        if (payload.token) {
                            setGithubToken(payload.token);
                            localStorage.setItem('tracker_gh_token', payload.token);
                        }
                        if (payload.pass) {
                            setMasterPassword(payload.pass);
                            sessionStorage.setItem('tracker_master_pass', payload.pass);
                        }
                        window.history.replaceState(null, '', window.location.pathname);
                        alert('✅ Синхронизация и настройки успешно применены!');
                    }
                } catch (e) {
                    console.error('Ошибка импорта ссылки синхронизации:', e);
                }
            }, []);

            useEffect(() => {
                const html = document.getElementById('html-tag');
                if (isDark) html.classList.add('dark');
                else html.classList.remove('dark');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            }, [isDark]);

            useEffect(() => {
                localStorage.setItem('viewMode', viewMode);
            }, [viewMode]);

            useEffect(() => {
                localStorage.setItem('tracker_extra_weeks', extraWeeks);
            }, [extraWeeks]);

            const normalizeData = (raw) => {
                const work = {};
                Object.entries(raw.work || {}).forEach(([date, w]) => {
                    if (w.range && !w.start) {
                        const m = w.range.match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
                        if (m) {
                            w = { ...w, start: `${String(m[1]).padStart(2,'0')}:${m[2]}`, end: `${String(m[3]).padStart(2,'0')}:${m[4]}` };
                        }
                    }
                    work[date] = w;
                });
                return { tasks: raw.tasks || [], work };
            };

            const processLoadedJson = useCallback(async (parsedJson, currentPass) => {
                if (parsedJson && parsedJson.encrypted) {
                    setIsEncrypted(true);
                    setPendingContainer(parsedJson);

                    const passToTry = currentPass || masterPassword;
                    if (passToTry) {
                        try {
                            const decrypted = await decryptData(parsedJson, passToTry);
                            const norm = normalizeData(decrypted);
                            setData(norm);
                            setIsLocked(false);
                            setPinError(false);
                            return true;
                        } catch (e) {
                            console.warn('Не удалось расшифровать паролем:', e);
                            setIsLocked(true);
                            return false;
                        }
                    } else {
                        setIsLocked(true);
                        return false;
                    }
                } else {
                    setIsEncrypted(false);
                    setPendingContainer(null);
                    const norm = normalizeData(parsedJson || { tasks: [], work: {} });
                    setData(norm);
                    setIsLocked(false);
                    return true;
                }
            }, [masterPassword]);

            const loadData = useCallback(async () => {
                setSyncStatus('saving');
                let rawContainer = null;

                try {
                    const localRes = await fetch('/api/data', { signal: AbortSignal.timeout(1500) });
                    if (localRes.ok) {
                        rawContainer = await localRes.json();
                        localStorage.setItem('tracker_data_cache', JSON.stringify(rawContainer));
                        await processLoadedJson(rawContainer);
                        setSyncStatus('local-server');
                        return;
                    }
                } catch (e) {}

                if (gistId) {
                    try {
                        const headers = {};
                        if (githubToken) headers['Authorization'] = `Bearer ${githubToken.trim()}`;
                        const gistRes = await fetch(`https://api.github.com/gists/${gistId}`, { headers });
                        if (gistRes.ok) {
                            const gistJson = await gistRes.json();
                            let content = gistJson.files && gistJson.files['tasks.json'] ? gistJson.files['tasks.json'].content : null;
                            if (content) {
                                content = content.replace(/^\uFEFF/, '');
                                rawContainer = JSON.parse(content);
                                localStorage.setItem('tracker_data_cache', JSON.stringify(rawContainer));
                                await processLoadedJson(rawContainer);
                                setSyncStatus(githubToken ? 'cloud-synced' : 'local-cached');
                                setSyncError('');
                                return;
                            }
                        } else {
                            if (gistRes.status === 404) setSyncError('Gist не найден (проверьте ID)');
                            else if (gistRes.status === 401) setSyncError('Неверный GitHub токен');
                            else if (gistRes.status === 403) setSyncError('Лимит запросов GitHub (введите токен)');
                        }
                    } catch (e) {
                        console.warn('Gist fetch error:', e);
                        setSyncError('Сетевая ошибка синхронизации');
                    }
                }

                const local = localStorage.getItem('tracker_data_cache');
                if (local) {
                    try {
                        rawContainer = JSON.parse(local);
                        await processLoadedJson(rawContainer);
                    } catch (e) {}
                }
                setSyncStatus(githubToken ? 'cloud-error' : 'local-only');
            }, [gistId, githubToken, processLoadedJson]);

            useEffect(() => {
                loadData();
                const interval = setInterval(loadData, 45000);
                return () => clearInterval(interval);
            }, [loadData]);

            const saveTimeoutRef = useRef(null);
            const saveToServer = (newData, explicitPass) => {
                setData(newData);
                setSyncStatus('saving');

                if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);

                saveTimeoutRef.current = setTimeout(async () => {
                    let containerToSave = newData;
                    const passToUse = explicitPass !== undefined ? explicitPass : masterPassword;

                    if (isEncrypted && passToUse) {
                        try {
                            containerToSave = await encryptData(newData, passToUse);
                        } catch (e) {
                            console.error('Ошибка шифрования перед сохранением:', e);
                            setSyncStatus('cloud-error');
                            return;
                        }
                    }

                    localStorage.setItem('tracker_data_cache', JSON.stringify(containerToSave));

                    let localSaved = false;
                    try {
                        const res = await fetch('/api/data', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(containerToSave),
                            signal: AbortSignal.timeout(2000)
                        });
                        if (res.ok) localSaved = true;
                    } catch (e) {}

                    if (gistId && githubToken) {
                        try {
                            const res = await fetch(`https://api.github.com/gists/${gistId}`, {
                                method: 'PATCH',
                                headers: {
                                    'Authorization': `Bearer ${githubToken.trim()}`,
                                    'Content-Type': 'application/json',
                                    'Accept': 'application/vnd.github.v3+json'
                                },
                                body: JSON.stringify({
                                    description: `Task Tracker Database - Updated ${new Date().toISOString()}`,
                                    files: {
                                        'tasks.json': {
                                            content: JSON.stringify(containerToSave, null, 2)
                                        }
                                    }
                                })
                            });
                            if (res.ok) {
                                setSyncStatus('cloud-synced');
                                setSyncError('');
                                return;
                            } else {
                                const errData = await res.json();
                                setSyncError(errData.message || 'Ошибка сохранения в Gist');
                                setSyncStatus('cloud-error');
                                return;
                            }
                        } catch (e) {
                            console.error('Ошибка записи в Gist:', e);
                            setSyncError('Сетевая ошибка сохранения');
                            setSyncStatus('cloud-error');
                            return;
                        }
                    }

                    if (localSaved) {
                        setSyncStatus('local-server');
                    } else if (!githubToken) {
                        setSyncStatus('local-only');
                    } else {
                        setSyncStatus('cloud-error');
                    }
                }, 600);
            };

            const handleUnlock = async (e) => {
                if (e) e.preventDefault();
                if (!pinInput) return;
                setPinError(false);

                if (pendingContainer) {
                    try {
                        const dec = await decryptData(pendingContainer, pinInput);
                        setMasterPassword(pinInput);
                        sessionStorage.setItem('tracker_master_pass', pinInput);
                        setData(normalizeData(dec));
                        setIsLocked(false);
                        setPinInput('');
                    } catch (err) {
                        console.error('Ошибка расшифровки:', err);
                        setPinError(true);
                    }
                }
            };

            const handleEnableEncryption = async () => {
                if (!newPassInput.trim()) {
                    alert('Введите пароль или PIN-код!');
                    return;
                }
                const pass = newPassInput.trim();
                try {
                    setIsEncrypted(true);
                    setMasterPassword(pass);
                    sessionStorage.setItem('tracker_master_pass', pass);
                    saveToServer(data, pass);
                    setNewPassInput('');
                    alert('🔒 Сквозное шифрование AES-256 успешно включено! Ваши задачи зашифрованы в облаке и на всех устройствах.');
                } catch (e) {
                    alert('Ошибка включения шифрования: ' + e.message);
                }
            };

            const handleDisableEncryption = () => {
                if (confirm('Отключить сквозное шифрование? Задачи будут сохранены в открытом виде.')) {
                    setIsEncrypted(false);
                    setMasterPassword('');
                    sessionStorage.removeItem('tracker_master_pass');
                    saveToServer(data, '');
                    alert('🔓 Шифрование отключено.');
                }
            };

            const handleLockNow = () => {
                setMasterPassword('');
                sessionStorage.removeItem('tracker_master_pass');
                setIsLocked(true);
                setData({ tasks: [], work: {} });
                loadData();
            };

            const addTask = (date) => {
                const text = newTaskText[date] && newTaskText[date].trim();
                if (!text) return;
                const newTask = { id: Date.now(), date, text, isDone: false, color: 'default', type: viewMode };
                saveToServer({ ...data, tasks: [newTask, ...data.tasks] });
                setNewTaskText({ ...newTaskText, [date]: '' });
            };

            const toggleDone = (id) => saveToServer({ ...data, tasks: data.tasks.map(t => t.id === id ? { ...t, isDone: !t.isDone } : t) });
            const deleteTask = (id) => {
                if (confirm('Удалить задачу?')) {
                    saveToServer({ ...data, tasks: data.tasks.filter(t => t.id !== id) });
                }
            };
            const setColor = (id, color) => saveToServer({ ...data, tasks: data.tasks.map(t => t.id === id ? { ...t, color } : t) });

            const sortDayTasks = (date) => {
                const daySorted = data.tasks
                    .filter(t => t.date === date && (t.type || 'study') === viewMode)
                    .sort((a, b) => (colorOrder[a.color || 'default'] || 5) - (colorOrder[b.color || 'default'] || 5) || Number(a.isDone) - Number(b.isDone) || b.id - a.id);
                let idx = 0;
                saveToServer({
                    ...data,
                    tasks: data.tasks.map(t => t.date === date && (t.type || 'study') === viewMode ? daySorted[idx++] : t)
                });
            };

            const onDragStart = (e, id) => {
                setDraggedTaskId(id);
                e.dataTransfer.effectAllowed = 'move';
            };

            const onDragOverTask = (e, targetId) => {
                e.preventDefault();
                e.stopPropagation();
                const rect = e.currentTarget.getBoundingClientRect();
                const position = e.clientY < rect.top + rect.height / 2 ? 'top' : 'bottom';
                if (dropTarget.id !== targetId || dropTarget.position !== position) {
                    setDropTarget({ id: targetId, position });
                }
            };

            const onDropOnTask = (e, targetDate, targetId) => {
                e.preventDefault();
                e.stopPropagation();
                if (!draggedTaskId || draggedTaskId === targetId) {
                    setDropTarget({ id: null, position: null });
                    setDraggedTaskId(null);
                    return;
                }
                const updatedTasks = [...data.tasks];
                const draggedIdx = updatedTasks.findIndex(t => t.id === draggedTaskId);
                if (draggedIdx < 0) return;
                const draggedTask = { ...updatedTasks[draggedIdx], date: targetDate };
                updatedTasks.splice(draggedIdx, 1);
                const dropIdx = updatedTasks.findIndex(t => t.id === targetId);
                updatedTasks.splice(dropTarget.position === 'top' ? dropIdx : dropIdx + 1, 0, draggedTask);
                saveToServer({ ...data, tasks: updatedTasks });
                setDropTarget({ id: null, position: null });
                setDraggedTaskId(null);
            };

            const onDropOnDay = (e, date) => {
                e.preventDefault();
                if (!draggedTaskId) return;
                saveToServer({ ...data, tasks: data.tasks.map(t => t.id === draggedTaskId ? { ...t, date } : t) });
                setDraggedTaskId(null);
                setDropTarget({ id: null, position: null });
            };

            const timeToMin = (t) => {
                if (!t) return null;
                const [h, m] = t.split(':').map(Number);
                return h * 60 + m;
            };

            const formatHours = (hours) => {
                const value = parseFloat(hours);
                if (!Number.isFinite(value) || value <= 0) return '';
                const totalMinutes = Math.round(value * 60);
                const h = Math.floor(totalMinutes / 60);
                const m = totalMinutes % 60;
                return h + 'ч' + (m ? ' ' + m + 'м' : '');
            };

            const recalcHours = (date, patch = {}) => {
                const w = { ...(data.work[date] || {}), ...patch };
                const s = timeToMin(w.start), e = timeToMin(w.end);
                if (s == null || e == null) return patch;
                let total = (e >= s ? e - s : e + 1440 - s);
                (w.breaks || []).forEach(b => {
                    const bs = timeToMin(b.start), be = timeToMin(b.end);
                    if (bs != null && be != null) total -= (be >= bs ? be - bs : be + 1440 - bs);
                });
                return { ...patch, hours: Math.max(0, total / 60).toFixed(2) };
            };

            const handleWorkTime = (date, field, value) => {
                const patch = recalcHours(date, { [field]: value });
                saveToServer({ ...data, work: { ...data.work, [date]: { ...(data.work[date] || {}), ...patch } } });
            };

            const handleBreakChange = (date, idx, field, value) => {
                const breaks = [...(data.work[date]?.breaks || [])];
                breaks[idx] = { ...breaks[idx], [field]: value };
                const patch = recalcHours(date, { breaks });
                saveToServer({ ...data, work: { ...data.work, [date]: { ...(data.work[date] || {}), ...patch } } });
            };

            const addBreak = (date) => {
                const breaks = [...(data.work[date]?.breaks || []), { start: '', end: '' }];
                saveToServer({ ...data, work: { ...data.work, [date]: { ...(data.work[date] || {}), breaks } } });
            };

            const removeBreak = (date, idx) => {
                const breaks = (data.work[date]?.breaks || []).filter((_, i) => i !== idx);
                const patch = recalcHours(date, { breaks });
                saveToServer({ ...data, work: { ...data.work, [date]: { ...(data.work[date] || {}), ...patch } } });
            };

            const toggleBreaks = (date) => setExpandedBreaks(prev => ({ ...prev, [date]: !prev[date] }));

            const getWeeks = () => {
                const dates = [];
                const start = new Date(2026, 7, 31);
                const end = new Date(2027, 0, 31);
                end.setDate(end.getDate() + (extraWeeks * 7));

                for (let dt = new Date(start); dt <= end; dt.setDate(dt.getDate() + 1)) {
                    dates.push(toDateKey(dt));
                }

                const weeks = [];
                let current = [];
                dates.forEach(d => {
                    current.push(d);
                    if (new Date(d).getDay() === 0) {
                        weeks.push(current);
                        current = [];
                    }
                });
                if (current.length) weeks.push(current);
                return weeks;
            };

            const isWeekPast = (week) => week[week.length - 1] < todayKey;
            const isWeekCurrent = (week) => week[0] <= todayKey && todayKey <= week[week.length - 1];
            const isWeekCollapsed = (week, wIdx) => collapsedWeeks[wIdx] !== undefined ? collapsedWeeks[wIdx] : isWeekPast(week);
            const toggleWeek = (wIdx) => setCollapsedWeeks(prev => ({ ...prev, [wIdx]: !prev[wIdx] }));

            const scrollToToday = () => {
                const el = document.getElementById(`day-${todayKey}`);
                if (el) {

                                                                                    onClick={() => setColor(t.id, c)}
                                                                                    title={c}
                                                                                    className={`w-2.5 h-2.5 rounded-full border border-slate-400 ${swatchClass(c)}`}
                                                                                ></button>
                                                                            ))}
                                                                        </div>
                                                                        <button onClick={() => deleteTask(t.id)} className="text-[9px] font-bold text-red-500 uppercase hover:underline">
                                                                            Удал.
                                                                        </button>
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>

                                                        <div className="p-2 border-t border-slate-300 dark:border-zinc-700 bg-slate-100/70 dark:bg-zinc-700/30 rounded-b-xl flex-shrink-0">
                                                            <div className="flex gap-1.5">
                                                                <input
                                                                    className="flex-1 min-w-0 text-[11px] bg-white dark:bg-zinc-700 border border-slate-300 dark:border-zinc-600 rounded px-2 py-1 outline-none focus:border-blue-500 dark:focus:border-sky-400"
                                                                    placeholder="Новая задача..."
                                                                    value={newTaskText[dateStr] || ''}
                                                                    onChange={e => setNewTaskText({ ...newTaskText, [dateStr]: e.target.value })}
                                                                    onKeyDown={e => e.key === 'Enter' && addTask(dateStr)}
                                                                />
                                                                <button
                                                                    onClick={() => sortDayTasks(dateStr)}
                                                                    title="Сортировать: красный, оранжевый, зеленый, синий"
                                                                    className="w-7 h-7 rounded bg-white dark:bg-zinc-700 border border-slate-300 dark:border-zinc-600 text-[10px] font-black text-slate-600 dark:text-zinc-200"
                                                                >
                                                                    1-4
                                                                </button>
                                                                <button
                                                                    onClick={() => addTask(dateStr)}
                                                                    className={`w-7 h-7 rounded text-white font-black text-xs ${viewMode === 'work' ? 'bg-emerald-600' : 'bg-blue-700 dark:bg-sky-600'}`}
                                                                >
                                                                    +
                                                                </button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </section>
                            );
                        })}
                    </div>

                    <div className="mt-12 text-center">
                        <button
                            onClick={() => setExtraWeeks(prev => prev + 4)}
                            className="px-6 py-3 bg-white dark:bg-zinc-800 border-2 border-dashed border-blue-400 dark:border-sky-500 hover:border-blue-600 dark:hover:border-sky-400 text-blue-600 dark:text-sky-400 font-bold rounded-2xl shadow-sm hover:shadow-md transition-all text-sm flex items-center gap-2 mx-auto"
                        >
                            <span>➕ Добавить следующие 4 недели</span>
                        </button>
                    </div>

                    {isSettingsOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white dark:bg-zinc-800 border border-slate-300 dark:border-zinc-700 p-6 rounded-2xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto space-y-6">
                                <div className="flex justify-between items-center border-b border-slate-200 dark:border-zinc-700 pb-3">
                                    <h3 className="text-lg font-bold text-slate-800 dark:text-zinc-100 flex items-center gap-2">
                                        ⚙️ Настройки и Синхронизация
                                    </h3>
                                    <button onClick={() => setIsSettingsOpen(false)} className="text-slate-400 hover:text-slate-600 text-lg font-black">✕</button>
                                </div>

                                <div className="space-y-3 bg-slate-50 dark:bg-zinc-700/40 p-4 rounded-xl border border-slate-200 dark:border-zinc-700">
                                    <h4 className="font-bold text-xs uppercase tracking-wider text-slate-600 dark:text-zinc-300 flex items-center gap-1.5">
                                        ☁️ Облачная синхронизация (GitHub Gist)
                                    </h4>
                                    <p className="text-[11px] text-slate-500 dark:text-zinc-400">
                                        Позволяет синхронизировать задачи и часы между телефоном и компьютером в реальном времени.
                                    </p>

                                    <div>
                                        <label className="text-[10px] font-bold uppercase text-slate-500 dark:text-zinc-400">Gist ID</label>
                                        <input
                                            type="text"
                                            className="w-full text-xs font-mono bg-white dark:bg-zinc-800 border border-slate-300 dark:border-zinc-600 rounded px-2 py-1.5 outline-none"
                                            value={gistId}
                                            onChange={e => {
                                                setGistId(e.target.value);
                                                localStorage.setItem('tracker_gist_id', e.target.value);
                                            }}
                                        />
                                    </div>

                                    <div>
                                        <label className="text-[10px] font-bold uppercase text-slate-500 dark:text-zinc-400">GitHub Personal Access Token</label>
                                        <input
                                            type="password"
                                            placeholder="ghp_..."
                                            className="w-full text-xs font-mono bg-white dark:bg-zinc-800 border border-slate-300 dark:border-zinc-600 rounded px-2 py-1.5 outline-none"
                                            value={githubToken}
                                            onChange={e => {
                                                setGithubToken(e.target.value);
                                                localStorage.setItem('tracker_gh_token', e.target.value);
                                            }}
                                        />
                                    </div>

                                    <div className="flex flex-col sm:flex-row gap-2 pt-1">
                                        <button
                                            onClick={loadData}
                                            className="flex-1 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg text-xs"
                                        >
                                            🔄 Проверить синхронизацию
                                        </button>
                                        <button
                                            onClick={copyMobileLink}
                                            title="Скопировать ссылку со всеми настройками для открытия на телефоне"
                                            className="flex-1 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg text-xs"
                                        >
                                            {copySuccess ? '✓ Скопировано!' : '📱 Ссылка для телефона'}
                                        </button>
                                    </div>
                                </div>

                                <div className="space-y-3 bg-slate-50 dark:bg-zinc-700/40 p-4 rounded-xl border border-slate-200 dark:border-zinc-700">
                                    <h4 className="font-bold text-xs uppercase tracking-wider text-slate-600 dark:text-zinc-300 flex items-center gap-1.5">
                                        🔒 Сквозное шифрование (AES-256)
                                    </h4>
                                    <p className="text-[11px] text-slate-500 dark:text-zinc-400">
                                        Защищает ваши задачи мастер-паролем или PIN-кодом. В облаке и на устройствах данные хранятся в зашифрованном виде. Без пароля никто не сможет их прочитать.
                                    </p>
                                    
                                    {isEncrypted ? (
                                        <div className="space-y-3">
                                            <div className="p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded-xl flex items-center justify-between">
                                                <span className="text-xs font-bold text-emerald-700 dark:text-emerald-300 flex items-center gap-1.5">
                                                    <span>🛡️</span> Шифрование активно
                                                </span>
                                                <button
                                                    onClick={handleDisableEncryption}
                                                    className="px-3 py-1 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-lg text-[10px]"
                                                >
                                                    Отключить
                                                </button>
                                            </div>
                                            <div className="flex gap-2">
                                                <input
                                                    type="password"
                                                    placeholder="Новый мастер-пароль / PIN..."
                                                    value={newPassInput}
                                                    onChange={e => setNewPassInput(e.target.value)}
                                                    className="flex-1 text-xs bg-white dark:bg-zinc-800 border border-slate-300 dark:border-zinc-600 rounded px-2 py-1.5 outline-none"
                                                />
                                                <button
                                                    onClick={handleEnableEncryption}
                                                    className="px-3 py-1.5 bg-slate-700 hover:bg-slate-800 text-white font-bold rounded-lg text-xs"
                                                >
                                                    Сменить пароль
                                                </button>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="space-y-2">
                                            <div className="flex gap-2">
                                                <input
                                                    type="password"
                                                    placeholder="Задайте мастер-пароль или PIN..."
                                                    value={newPassInput}
                                                    onChange={e => setNewPassInput(e.target.value)}
                                                    className="flex-1 text-xs bg-white dark:bg-zinc-800 border border-slate-300 dark:border-zinc-600 rounded px-2 py-1.5 outline-none"
                                                />
                                                <button
                                                    onClick={handleEnableEncryption}
                                                    className="px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg text-xs"
                                                >
                                                    Зашифровать
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="space-y-3 bg-slate-50 dark:bg-zinc-700/40 p-4 rounded-xl border border-slate-200 dark:border-zinc-700">
                                    <h4 className="font-bold text-xs uppercase tracking-wider text-slate-600 dark:text-zinc-300 flex items-center gap-1.5">
                                        💾 Резервные копии
                                    </h4>
                                    <div className="flex gap-2">
                                        <button
                                            onClick={exportBackup}
                                            className="flex-1 py-2 bg-slate-200 dark:bg-zinc-700 hover:bg-slate-300 text-slate-800 dark:text-zinc-200 font-bold rounded-lg text-xs flex items-center justify-center gap-1"
                                        >
                                            📥 Скачать .json
                                        </button>
                                        <label className="flex-1 py-2 bg-slate-200 dark:bg-zinc-700 hover:bg-slate-300 text-slate-800 dark:text-zinc-200 font-bold rounded-lg text-xs flex items-center justify-center gap-1 cursor-pointer">
                                            📤 Загрузить .json
                                            <input type="file" accept=".json" onChange={importBackup} className="hidden" />
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
