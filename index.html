<body class="bg-slate-200 dark:bg-zinc-900 text-slate-900 dark:text-zinc-100 min-h-screen transition-colors duration-300 pb-24 font-sans antialiased">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const APP_VERSION = "2.4.3";

        const forceRefreshCache = () => {
            if ('caches' in window) {
                caches.keys().then(names => {
                    names.forEach(name => caches.delete(name));
                });
            }
            localStorage.setItem('tracker_app_version', APP_VERSION);
            // Append timestamp to URL query to force clean load without caching
            const url = new URL(window.location.href);
            url.searchParams.set('v', Date.now());
            window.location.href = url.toString();
        };

        const months = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
        const fullMonths = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
        const dows = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
        const fullDows = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
        const colorOrder = { red: 1, orange: 2, green: 3, blue: 4, default: 5 };

        const formatTimeInput = (raw) => {
            const digits = (raw || '').replace(/\D/g, '').slice(0, 4);
            if (digits.length <= 2) return digits;
            return digits.slice(0, 2) + ':' + digits.slice(2);
        };

        const TimeInput = ({ value, onChange, className, placeholder = "--:--" }) => {
            const handleKey = (e) => {
                if (e.key === 'Backspace' && value && value.endsWith(':')) {
                    e.preventDefault();
                    onChange(value.slice(0, -1));
                }
            };
            return (
                <input
                    type="text"
                    inputMode="numeric"
                    maxLength={5}
                    placeholder={placeholder}
                    className={className}
                    value={value || ''}
                    onKeyDown={handleKey}
                    onChange={e => onChange(formatTimeInput(e.target.value))}
                />
            );
        };

        const toDateKey = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
        const todayKey = toDateKey(new Date());

        const DEFAULT_GIST_ID = 'e66de7295cfcb3a815f2530ae3a21e04';

        // Web Crypto AES-256-GCM + PBKDF2 Helpers
        async function deriveKey(password, salt) {
            const enc = new TextEncoder();
            const keyMaterial = await window.crypto.subtle.importKey(
                'raw',
                enc.encode(password),
                'PBKDF2',
                false,
                ['deriveKey']
            );
            return window.crypto.subtle.deriveKey(
                {
                    name: 'PBKDF2',
                    salt: salt,
                    iterations: 100000,
                    hash: 'SHA-256'
                },
                keyMaterial,
                { name: 'AES-GCM', length: 256 },
                false,
                ['encrypt', 'decrypt']
            );
        }

        async function encryptData(dataObj, password) {
            const enc = new TextEncoder();
            const plaintext = enc.encode(JSON.stringify(dataObj));
            const salt = window.crypto.getRandomValues(new Uint8Array(16));
            const iv = window.crypto.getRandomValues(new Uint8Array(12));
            const key = await deriveKey(password, salt);
            const ciphertext = await window.crypto.subtle.encrypt(
                { name: 'AES-GCM', iv: iv },
                key,
                plaintext
            );
            const toB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
            return {
                encrypted: true,
                version: 2,
                salt: toB64(salt),
                iv: toB64(iv),
                ciphertext: toB64(ciphertext)
            };
        }

        async function decryptData(encryptedObj, password) {
            const fromB64 = (str) => Uint8Array.from(atob(str), c => c.charCodeAt(0));
            const salt = fromB64(encryptedObj.salt);
            const iv = fromB64(encryptedObj.iv);
            const ciphertext = fromB64(encryptedObj.ciphertext);
            const key = await deriveKey(password, salt);
            const decrypted = await window.crypto.subtle.decrypt(
                { name: 'AES-GCM', iv: iv },
                key,
                ciphertext
            );
            const dec = new TextDecoder();
            return JSON.parse(dec.decode(decrypted));
        }

        function App() {
            const [data, setData] = useState({ tasks: [], work: {}, templates: [] });
            const [isEncrypted, setIsEncrypted] = useState(false);
            const [pendingContainer, setPendingContainer] = useState(null);
            const [masterPassword, setMasterPassword] = useState(() => sessionStorage.getItem('tracker_master_pass') || '');
            const [isLocked, setIsLocked] = useState(false);
            const [pinInput, setPinInput] = useState('');
            const [pinError, setPinError] = useState(false);
            const [newPassInput, setNewPassInput] = useState('');

            const [newTaskText, setNewTaskText] = useState({});
            const [editingId, setEditingId] = useState(null);
            const [editValue, setEditValue] = useState("");
            const [isDark, setIsDark] = useState(() => localStorage.getItem('theme') === 'dark');
            const [viewMode, setViewMode] = useState(() => localStorage.getItem('viewMode') || 'study');
            const [draggedTaskId, setDraggedTaskId] = useState(null);
            const [dropTarget, setDropTarget] = useState({ id: null, position: null });
            const [collapsedWeeks, setCollapsedWeeks] = useState({});

            const [extraWeeks, setExtraWeeks] = useState(() => {
                const saved = localStorage.getItem('tracker_extra_weeks');
                return saved ? parseInt(saved, 10) : 0;
            });

            const [gistId, setGistId] = useState(() => localStorage.getItem('tracker_gist_id') || DEFAULT_GIST_ID);
            const [githubToken, setGithubToken] = useState(() => localStorage.getItem('tracker_gh_token') || '');
            const [syncStatus, setSyncStatus] = useState('local-only');
            const [syncError, setSyncError] = useState('');
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [copySuccess, setCopySuccess] = useState(false);

            // Quick Time Popover & Template Modals
            const [editingTimeDate, setEditingTimeDate] = useState(null);
            const [templateModalWeek, setTemplateModalWeek] = useState(null);
            const [newTemplateName, setNewTemplateName] = useState('');

            // Pomodoro Focus Timer
            const [isPomodoroOpen, setIsPomodoroOpen] = useState(false);
            const [pomoTime, setPomoTime] = useState(25 * 60);
            const [pomoRunning, setPomoRunning] = useState(false);
            const [pomoMode, setPomoMode] = useState('work');

            useEffect(() => {
                let timer = null;
                if (pomoRunning && pomoTime > 0) {
                    timer = setInterval(() => setPomoTime(t => t - 1), 1000);
                } else if (pomoTime === 0 && pomoRunning) {
                    setPomoRunning(false);
                    alert(pomoMode === 'work' ? '🎉 Время фокуса завершено! Сделайте 5-минутный перерыв.' : '⏰ Перерыв окончен! Готовы снова к задачам?');
                    if (pomoMode === 'work') {
                        setPomoMode('break');
                        setPomoTime(5 * 60);
                    } else {
                        setPomoMode('work');
                        setPomoTime(25 * 60);
                    }
                }
                return () => clearInterval(timer);
            }, [pomoRunning, pomoTime, pomoMode]);

            useEffect(() => {
                try {
                    const hash = window.location.hash;
                    if (hash && hash.startsWith('#sync=')) {
                        const payload = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(hash.replace('#sync=', ''))))));
                        if (payload.gistId) {
                            setGistId(payload.gistId);
                            localStorage.setItem('tracker_gist_id', payload.gistId);
                        }
                        if (payload.token) {
                            setGithubToken(payload.token);
                            localStorage.setItem('tracker_gh_token', payload.token);
                        }
                        if (payload.pass) {
                            setMasterPassword(payload.pass);
                            sessionStorage.setItem('tracker_master_pass', payload.pass);
                        }
                        window.history.replaceState(null, '', window.location.pathname);
                        alert('✅ Синхронизация и настройки успешно применены!');
                    }
                } catch (e) {
                    console.error('Ошибка импорта ссылки синхронизации:', e);
                }
            }, []);

            useEffect(() => {
                const savedVer = localStorage.getItem('tracker_app_version');
                if (savedVer && savedVer !== APP_VERSION) {
                    localStorage.setItem('tracker_app_version', APP_VERSION);
                    if ('caches' in window) {
                        caches.keys().then(names => names.forEach(name => caches.delete(name)));
                    }
                } else if (!savedVer) {
                    localStorage.setItem('tracker_app_version', APP_VERSION);
                }
            }, []);

            useEffect(() => {
                const html = document.getElementById('html-tag');
                if (isDark) html.classList.add('dark');
                else html.classList.remove('dark');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            }, [isDark]);

            useEffect(() => {
                localStorage.setItem('viewMode', viewMode);
            }, [viewMode]);

            useEffect(() => {
                localStorage.setItem('tracker_extra_weeks', extraWeeks);
            }, [extraWeeks]);

            const timeToMin = (t) => {
                if (!t) return null;
                const [h, m] = t.split(':').map(Number);
                return h * 60 + m;
            };

            const formatHours = (hours) => {
                const value = parseFloat(hours);
                if (!Number.isFinite(value) || value <= 0) return '';
                const totalMinutes = Math.round(value * 60);
                const h = Math.floor(totalMinutes / 60);
                const m = totalMinutes % 60;
                return h + 'ч' + (m ? ' ' + m + 'м' : '');
            };

            const recalcHoursObj = (w) => {
                const s = timeToMin(w.start), e = timeToMin(w.end);
                if (s == null || e == null) return { ...w, hours: '' };
                let total = (e >= s ? e - s : e + 1440 - s);
                (w.breaks || []).forEach(b => {
                    const bs = timeToMin(b.start), be = timeToMin(b.end);
                    if (bs != null && be != null) total -= (be >= bs ? be - bs : be + 1440 - bs);
                });
                return { ...w, hours: Math.max(0, total / 60).toFixed(2) };
            };

            const defaultTemplates = [
                {
                    id: 'std-5-2',
                    name: '💼 Стандартная работа 5/2 (09:00-18:00, 40ч)',
                    type: 'work',
                    workHours: { start: '09:00', end: '18:00', breaks: [{ start: '13:00', end: '14:00' }], hours: '8.00' }
                },
                {
                    id: 'std-10-19',
                    name: '💼 Смена 10:00 — 19:00 (Обед 1ч)',
                    type: 'work',
                    workHours: { start: '10:00', end: '19:00', breaks: [{ start: '14:00', end: '15:00' }], hours: '8.00' }
                }
            ];

            const normalizeData = (raw) => {
                const work = {};
                Object.entries(raw.work || {}).forEach(([date, w]) => {
                    if (w.range && !w.start) {
                        const m = w.range.match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
                        if (m) {
                            w = { ...w, start: `${String(m[1]).padStart(2,'0')}:${m[2]}`, end: `${String(m[3]).padStart(2,'0')}:${m[4]}` };
                        }
                    }
                    work[date] = recalcHoursObj(w);
                });
                return {
                    tasks: (raw.tasks || []).map(t => ({ ...t, isUrgent: !!t.isUrgent })),
                    work,
                    templates: raw.templates && raw.templates.length ? raw.templates : defaultTemplates
                };
            };

            const processLoadedJson = useCallback(async (parsedJson, currentPass) => {
                if (parsedJson && parsedJson.encrypted) {
                    setIsEncrypted(true);
                    setPendingContainer(parsedJson);

                    const passToTry = currentPass || masterPassword;
                    if (passToTry) {
                        try {
                            const decrypted = await decryptData(parsedJson, passToTry);
                            const norm = normalizeData(decrypted);
                            setData(norm);
                            setIsLocked(false);
                            setPinError(false);
                            return true;
                        } catch (e) {
                            console.warn('Не удалось расшифровать паролем:', e);
                            setIsLocked(true);
                            return false;
                        }
                    } else {
                        setIsLocked(true);
                        return false;
                    }
                } else {
                    setIsEncrypted(false);
                    setPendingContainer(null);
                    const norm = normalizeData(parsedJson || { tasks: [], work: {} });
                    setData(norm);
                    setIsLocked(false);
                    return true;
                }
            }, [masterPassword]);

            const loadData = useCallback(async () => {
                setSyncStatus('saving');
                let rawContainer = null;

                try {
                    const localRes = await fetch('/api/data', { signal: AbortSignal.timeout(1500) });
                    if (localRes.ok) {
                        rawContainer = await localRes.json();
                        localStorage.setItem('tracker_data_cache', JSON.stringify(rawContainer));
                        await processLoadedJson(rawContainer);
                        setSyncStatus('local-server');
                        return;
                    }
                } catch (e) {}

                if (gistId) {
                    try {
                        const headers = {};
                        if (githubToken) headers['Authorization'] = `Bearer ${githubToken.trim()}`;
                        const gistRes = await fetch(`https://api.github.com/gists/${gistId}`, { headers });
                        if (gistRes.ok) {
                            const gistJson = await gistRes.json();
                            let content = gistJson.files && gistJson.files['tasks.json'] ? gistJson.files['tasks.json'].content : null;
                            if (content) {
                                content = content.replace(/^\uFEFF/, '');
                                rawContainer = JSON.parse(content);
                                localStorage.setItem('tracker_data_cache', JSON.stringify(rawContainer));
                                await processLoadedJson(rawContainer);
                                setSyncStatus(githubToken ? 'cloud-synced' : 'local-cached');
                                setSyncError('');
                                return;
                            }
                        } else {
                            if (gistRes.status === 404) setSyncError('Gist не найден (проверьте ID)');
                            else if (gistRes.status === 401) setSyncError('Неверный GitHub токен');
                            else if (gistRes.status === 403) setSyncError('Лимит запросов GitHub (введите токен)');
                        }
                    } catch (e) {
                        console.warn('Gist fetch error:', e);
                        setSyncError('Сетевая ошибка синхронизации');
                    }
                }

                const local = localStorage.getItem('tracker_data_cache');
                if (local) {
                    try {
                        rawContainer = JSON.parse(local);
                        await processLoadedJson(rawContainer);
                    } catch (e) {}
                }
                setSyncStatus(githubToken ? 'cloud-error' : 'local-only');
            }, [gistId, githubToken, processLoadedJson]);

            useEffect(() => {
                loadData();
                const interval = setInterval(loadData, 45000);
                return () => clearInterval(interval);
            }, [loadData]);

            const saveTimeoutRef = useRef(null);
            const saveToServer = (newData, explicitPass) => {
                setData(newData);
                setSyncStatus('saving');

                if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);

                saveTimeoutRef.current = setTimeout(async () => {
                    let containerToSave = newData;
                    const passToUse = explicitPass !== undefined ? explicitPass : masterPassword;

                    if (isEncrypted && passToUse) {
                        try {
                            containerToSave = await encryptData(newData, passToUse);
                        } catch (e) {
                            console.error('Ошибка шифрования перед сохранением:', e);
                            setSyncStatus('cloud-error');
                            return;
                        }
                    }

                    localStorage.setItem('tracker_data_cache', JSON.stringify(containerToSave));

                    let localSaved = false;
                    try {
                        const res = await fetch('/api/data', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(containerToSave),
                            signal: AbortSignal.timeout(2000)
                        });
                        if (res.ok) localSaved = true;
                    } catch (e) {}

                    if (gistId && githubToken) {
                        try {
                            const res = await fetch(`https://api.github.com/gists/${gistId}`, {
                                method: 'PATCH',
                                headers: {
                                    'Authorization': `Bearer ${githubToken.trim()}`,
                                    'Content-Type': 'application/json',
                                    'Accept': 'application/vnd.github.v3+json'
                                },
                                body: JSON.stringify({
                                    description: `Task Tracker Database - Updated ${new Date().toISOString()}`,
                                    files: {
                                        'tasks.json': {
                                            content: JSON.stringify(containerToSave, null, 2)
                                        }
                                    }
                                })
                            });
                            if (res.ok) {
                                setSyncStatus('cloud-synced');
                                setSyncError('');
                                return;
                            } else {
                                const errData = await res.json();
                                setSyncError(errData.message || 'Ошибка сохранения в Gist');
                                setSyncStatus('cloud-error');
                                return;
                            }
                        } catch (e) {
                            console.error('Ошибка записи в Gist:', e);
                            setSyncError('Сетевая ошибка сохранения');
                            setSyncStatus('cloud-error');
                            return;
                        }
                    }

                    if (localSaved) {
                        setSyncStatus('local-server');
                    } else if (!githubToken) {
                        setSyncStatus('local-only');
                    } else {
                        setSyncStatus('cloud-error');
                    }
                }, 600);
            };

            const handleUnlock = async (e) => {
                if (e) e.preventDefault();
                if (!pinInput) return;
                setPinError(false);

                if (pendingContainer) {
                    try {
                        const dec = await decryptData(pendingContainer, pinInput);
                        setMasterPassword(pinInput);
                        sessionStorage.setItem('tracker_master_pass', pinInput);
                        setData(normalizeData(dec));
                        setIsLocked(false);
                        setPinInput('');
                    } catch (err) {
                        console.error('Ошибка расшифровки:', err);
                        setPinError(true);
                    }
                }
            };

            const handleEnableEncryption = async () => {
                if (!newPassInput.trim()) {
                    alert('Введите пароль или PIN-код!');
                    return;
                }
                const pass = newPassInput.trim();
                try {
                    setIsEncrypted(true);
                    setMasterPassword(pass);
                    sessionStorage.setItem('tracker_master_pass', pass);
                    saveToServer(data, pass);
                    setNewPassInput('');
                    alert('🔒 Сквозное шифрование AES-256 успешно включено! Ваши задачи зашифрованы в облаке и на всех устройствах.');
                } catch (e) {
                    alert('Ошибка включения шифрования: ' + e.message);
                }
            };

            const handleDisableEncryption = () => {
                if (confirm('Отключить сквозное шифрование? Задачи будут сохранены в открытом виде.')) {
                    setIsEncrypted(false);
                    setMasterPassword('');
                    sessionStorage.removeItem('tracker_master_pass');
                    saveToServer(data, '');
                    alert('🔓 Шифрование отключено.');
                }
            };

            const handleLockNow = () => {
                setMasterPassword('');
                sessionStorage.removeItem('tracker_master_pass');
                setIsLocked(true);
                setData({ tasks: [], work: {} });
                loadData();
            };

            const exportBackup = () => {
                try {
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
                    const downloadAnchor = document.createElement('a');
                    downloadAnchor.setAttribute("href", dataStr);
                    downloadAnchor.setAttribute("download", `task_tracker_backup_${toDateKey(new Date())}.json`);
                    document.body.appendChild(downloadAnchor);
                    downloadAnchor.click();
                    downloadAnchor.remove();
                } catch (e) {
                    alert('Ошибка при экспорте: ' + e.message);
                }
            };

            const importBackup = (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const parsed = JSON.parse(evt.target.result);
                        const normalized = normalizeData(parsed);
                        setData(normalized);
                        saveToServer(normalized);
                        alert('✅ Резервная копия успешно импортирована!');
                    } catch (err) {
                        alert('❌ Ошибка чтения файла резервной копии. Проверьте формат .json');
                    }
                };
                reader.readAsText(file);
            };

            const addTask = (date) => {
                const text = newTaskText[date] && newTaskText[date].trim();
                if (!text) return;
                const newTask = { id: Date.now(), date, text, isDone: false, isUrgent: false, color: 'default', type: viewMode };
                saveToServer({ ...data, tasks: [newTask, ...data.tasks] });
                setNewTaskText({ ...newTaskText, [date]: '' });
            };

            const toggleDone = (id) => saveToServer({ ...data, tasks: data.tasks.map(t => t.id === id ? { ...t, isDone: !t.isDone } : t) });
            const toggleUrgent = (id) => saveToServer({ ...data, tasks: data.tasks.map(t => t.id === id ? { ...t, isUrgent: !t.isUrgent } : t) });

            const deleteTask = (id) => {
                if (confirm('Удалить задачу?')) {
                    saveToServer({ ...data, tasks: data.tasks.filter(t => t.id !== id) });
                }
            };

            const setColor = (id, color) => saveToServer({ ...data, tasks: data.tasks.map(t => t.id === id ? { ...t, color } : t) });

            const sortDayTasks = (date) => {
                const daySorted = data.tasks
                    .filter(t => t.date === date && (t.type || 'study') === viewMode)
                    .sort((a, b) => (Number(b.isUrgent || 0) - Number(a.isUrgent || 0)) || (colorOrder[a.color || 'default'] || 5) - (colorOrder[b.color || 'default'] || 5) || Number(a.isDone) - Number(b.isDone) || b.id - a.id);
                let idx = 0;
                saveToServer({
                    ...data,
                    tasks: data.tasks.map(t => t.date === date && (t.type || 'study') === viewMode ? daySorted[idx++] : t)
                });
            };

            const onDragStart = (e, id) => {
                setDraggedTaskId(id);
                e.dataTransfer.effectAllowed = 'move';
            };

            const onDragOverTask = (e, targetId) => {
                e.preventDefault();
                e.stopPropagation();
                const rect = e.currentTarget.getBoundingClientRect();
                const position = e.clientY < rect.top + rect.height / 2 ? 'top' : 'bottom';
                if (dropTarget.id !== targetId || dropTarget.position !== position) {
                    setDropTarget({ id: targetId, position });
                }
            };

            const onDropOnTask = (e, targetDate, targetId) => {
                e.preventDefault();
                e.stopPropagation();
                if (!draggedTaskId || draggedTaskId === targetId) {
                    setDropTarget({ id: null, position: null });
                    setDraggedTaskId(null);
                    return;
                }
                const updatedTasks = [...data.tasks];
                const draggedIdx = updatedTasks.findIndex(t => t.id === draggedTaskId);
                if (draggedIdx < 0) return;
                const draggedTask = { ...updatedTasks[draggedIdx], date: targetDate };
                updatedTasks.splice(draggedIdx, 1);
                const dropIdx = updatedTasks.findIndex(t => t.id === targetId);
                updatedTasks.splice(dropTarget.position === 'top' ? dropIdx : dropIdx + 1, 0, draggedTask);
                saveToServer({ ...data, tasks: updatedTasks });
                setDropTarget({ id: null, position: null });
                setDraggedTaskId(null);
            };

            const onDropOnDay = (e, date) => {
                e.preventDefault();
                if (!draggedTaskId) return;
                saveToServer({ ...data, tasks: data.tasks.map(t => t.id === draggedTaskId ? { ...t, date } : t) });
                setDraggedTaskId(null);
                setDropTarget({ id: null, position: null });
            };

            // Work Hours Actions & Presets
            const applyWorkPreset = (date, preset) => {
                let w = { start: '', end: '', breaks: [], hours: '' };
                if (preset === '8h-09-18') {
                    w = { start: '09:00', end: '18:00', breaks: [{ start: '13:00', end: '14:00' }] };
                } else if (preset === '8h-10-19') {
                    w = { start: '10:00', end: '19:00', breaks: [{ start: '14:00', end: '15:00' }] };
                } else if (preset === '4h-morning') {
                    w = { start: '09:00', end: '13:00', breaks: [] };
                } else if (preset === '4h-afternoon') {
                    w = { start: '14:00', end: '18:00', breaks: [] };
                } else if (preset === 'yesterday') {
                    const prevDt = new Date(date);
                    prevDt.setDate(prevDt.getDate() - 1);
                    const prevKey = toDateKey(prevDt);
                    const prevWork = data.work[prevKey];
                    if (prevWork && prevWork.start) {
                        w = { ...prevWork };
                    }
                } else if (preset === 'clear') {
                    w = { start: '', end: '', breaks: [], hours: '' };
                }
                const updated = recalcHoursObj(w);
                saveToServer({ ...data, work: { ...data.work, [date]: updated } });
            };

            const fillWeekWork = (weekDates, preset = '8h-09-18') => {
                const updatedWork = { ...data.work };
                weekDates.forEach(d => {
                    const dow = new Date(d).getDay();
                    if (dow !== 0 && dow !== 6) {
                        let w = { start: '09:00', end: '18:00', breaks: [{ start: '13:00', end: '14:00' }] };
                        if (preset === '8h-10-19') w = { start: '10:00', end: '19:00', breaks: [{ start: '14:00', end: '15:00' }] };
                        updatedWork[d] = recalcHoursObj(w);
                    }
                });
                saveToServer({ ...data, work: updatedWork });
            };

            const clearWeekWork = (weekDates) => {
                if (confirm('Очистить рабочие часы за всю неделю?')) {
                    const updatedWork = { ...data.work };
                    weekDates.forEach(d => {
                        delete updatedWork[d];
                    });
                    saveToServer({ ...data, work: updatedWork });
                }
            };

            // Templates Management
            const saveCurrentWeekAsTemplate = (weekDates) => {
                if (!newTemplateName.trim()) {
                    alert('Введите название шаблона!');
                    return;
                }
                const weekTasks = data.tasks.filter(t => weekDates.includes(t.date));
                const weekDayTasks = {};
                weekDates.forEach((d, idx) => {
                    weekDayTasks[idx] = weekTasks.filter(t => t.date === d).map(t => ({
                        text: t.text,
                        color: t.color || 'default',
                        type: t.type || 'study',
                        isUrgent: !!t.isUrgent
                    }));
                });
                const weekDayWork = {};
                weekDates.forEach((d, idx) => {
                    if (data.work[d]) weekDayWork[idx] = data.work[d];
                });

                const newTpl = {
                    id: 'tpl-' + Date.now(),
                    name: newTemplateName.trim(),
                    type: viewMode,
                    dayTasks: weekDayTasks,
                    dayWork: weekDayWork
                };

                const updated = [...(data.templates || []), newTpl];
                saveToServer({ ...data, templates: updated });
                setNewTemplateName('');
                alert(`Шаблон "${newTpl.name}" успешно сохранен!`);
            };

            const applyTemplateToWeek = (template, weekDates) => {
                const newTasks = [...data.tasks];
                const newWork = { ...data.work };

                if (template.workHours) {
                    weekDates.forEach(d => {
                        const dow = new Date(d).getDay();
                        if (dow !== 0 && dow !== 6) {
                            newWork[d] = recalcHoursObj(template.workHours);
                        }
                    });
                }

                if (template.dayWork) {
                    weekDates.forEach((d, idx) => {
                        if (template.dayWork[idx]) newWork[d] = recalcHoursObj(template.dayWork[idx]);
                    });
                }

                if (template.dayTasks) {
                    weekDates.forEach((d, idx) => {
                        const tList = template.dayTasks[idx] || [];
                        tList.forEach(t => {
                            newTasks.unshift({
                                id: Date.now() + Math.floor(Math.random() * 100000),
                                date: d,
                                text: t.text,
                                isDone: false,
                                isUrgent: !!t.isUrgent,
                                color: t.color || 'default',
                                type: t.type || viewMode
                            });
                        });
                    });
                }

                saveToServer({ ...data, tasks: newTasks, work: newWork });
                setTemplateModalWeek(null);
                alert(`✅ Шаблон "${template.name}" применен к неделе!`);
            };

            const deleteTemplate = (id) => {
                if (confirm('Удалить этот шаблон?')) {
                    saveToServer({ ...data, templates: (data.templates || []).filter(t => t.id !== id) });
                }
            };

            const getWeeks = () => {
                const dates = [];
                const start = new Date(2026, 7, 31);
                const end = new Date(2027, 0, 31);
                end.setDate(end.getDate() + (extraWeeks * 7));

                for (let dt = new Date(start); dt <= end; dt.setDate(dt.getDate() + 1)) {
                    dates.push(toDateKey(dt));
                }

                const weeks = [];
                let current = [];
                dates.forEach(d => {
                    current.push(d);
                    if (new Date(d).getDay() === 0) {
                        weeks.push(current);
                        current = [];
                    }
                });
                if (current.length) weeks.push(current);
                return weeks;
            };

            const isWeekPast = (week) => week[week.length - 1] < todayKey;
            const isWeekCurrent = (week) => week[0] <= todayKey && todayKey <= week[week.length - 1];
            const isWeekCollapsed = (week, wIdx) => collapsedWeeks[wIdx] !== undefined ? collapsedWeeks[wIdx] : isWeekPast(week);
            const toggleWeek = (wIdx) => setCollapsedWeeks(prev => ({ ...prev, [wIdx]: !prev[wIdx] }));

            const scrollToToday = () => {

            const copyMobileLink = () => {

            const taskColorClass = (color) => {

                    case 'green': return 'bg-green-500';
                    case 'blue': return 'bg-blue-500';
                    default: return 'bg-white';
                }
            };

            // Global stats
            const currentModeTasks = data.tasks.filter(t => (t.type || 'study') === viewMode);
            const totalTasksCount = currentModeTasks.length;
            const doneTasksCount = currentModeTasks.filter(t => t.isDone).length;
            const completionPercent = totalTasksCount ? Math.round((doneTasksCount / totalTasksCount) * 100) : 0;

            return (
                <div className="max-w-[1800px] mx-auto p-3 sm:p-4 md:p-6 text-[13px]">

                                <div className="w-16 h-16 bg-blue-100 dark:bg-sky-950/60 text-blue-600 dark:text-sky-400 rounded-2xl flex items-center justify-center mx-auto text-3xl shadow-inner">
                                    🔒
                                </div>
                                <div>
                                    <h2 className="text-xl font-black text-slate-800 dark:text-zinc-100 mb-1">База защищена</h2>
                                    <p className="text-xs text-slate-500 dark:text-zinc-400">

                                    </p>
                                </div>
                                <form onSubmit={handleUnlock} className="space-y-4">
                                    <input

                                        placeholder="••••"

                                    <button

                        <div className="flex items-center gap-4">
                            <div>
                                <h1 className={`text-2xl font-black uppercase tracking-tight transition-colors ${viewMode === 'work' ? 'text-emerald-600 dark:text-emerald-400' : 'text-blue-700 dark:text-sky-400'}`}>
                                    {viewMode === 'study' ? '🎓 ТАСКИ: УЧЕБА' : '💼 ТАСКИ: РАБОТА'}
                                </h1>
                                <div className="flex items-center gap-3 mt-1">
                                    <p className="text-[10px] font-bold text-slate-500 dark:text-zinc-400 uppercase tracking-widest">
                                        Сентябрь 2026 — Январь 2027+
                                    </p>
                                    <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-200 dark:bg-zinc-700 text-slate-700 dark:text-zinc-300">
                                        ✓ {doneTasksCount}/{totalTasksCount} ({completionPercent}%)
                                    </span>
                                </div>
                            </div>
                        </div>

                        <div className="flex flex-wrap items-center gap-2">
                            <div
                                onClick={() => syncStatus.startsWith('cloud') && !syncError ? loadData() : setIsSettingsOpen(true)}
                                title={syncError ? `Ошибка: ${syncError}. Нажмите для настройки.` : 'Статус сохранения / синхронизации. Нажмите для настройки'}
                                className={`cursor-pointer px-3 py-1.5 rounded-lg border text-xs font-semibold flex items-center gap-1.5 transition-all ${
                                    syncStatus === 'cloud-synced' || syncStatus === 'local-server'
                                        ? 'bg-emerald-50 text-emerald-700 border-emerald-200 dark:bg-emerald-950/40 dark:text-emerald-300 dark:border-emerald-800'
                                        : syncStatus === 'saving'
                                        ? 'bg-amber-50 text-amber-700 border-amber-200 dark:bg-amber-950/40 dark:text-amber-300 dark:border-amber-800 animate-pulse'
                                        : syncStatus === 'local-cached' || syncStatus === 'local-only'
                                        ? 'bg-blue-50 text-blue-700 border-blue-200 dark:bg-sky-950/40 dark:text-sky-300 dark:border-sky-800'
                                        : 'bg-rose-50 text-rose-700 border-rose-200 dark:bg-rose-950/40 dark:text-rose-300 dark:border-rose-800'
                                }`}
                            >
                                <span className={`w-2 h-2 rounded-full ${
                                    syncStatus === 'cloud-synced' || syncStatus === 'local-server'
                                        ? 'bg-emerald-500'
                                        : syncStatus === 'saving'
                                        ? 'bg-amber-500'
                                        : syncStatus === 'local-cached' || syncStatus === 'local-only'
                                        ? 'bg-sky-500'

                                <span>{

                                }</span>
                            </div>

                            <button
                                onClick={scrollToToday}
                                title="Перейти к сегодняшнему дню"
                                className="px-3.5 py-1.5 rounded-lg bg-blue-100 text-blue-700 border border-blue-300 dark:bg-sky-950/50 dark:text-sky-300 dark:border-sky-800 font-bold text-xs hover:bg-blue-200 dark:hover:bg-sky-900/60 transition-all flex items-center gap-1"
                            >

                            </button>

                            <button

                    </header>

                    {isPomodoroOpen && (

                            <div className="flex items-center gap-3">

                                </div>
                                <button
                                    onClick={() => setPomoRunning(!pomoRunning)}

                                >

                    )}

                    <div className="space-y-10">
                        {getWeeks().map((week, wIdx) => {
                            let worked = 0;
                            week.forEach(d => worked += parseFloat(data.work[d]?.hours || 0));
                            const target = week.filter(d => ![0,6].includes(new Date(d).getDay())).length * 8;
                            const weekTasks = data.tasks.filter(t => week.includes(t.date) && (t.type || 'study') === viewMode);
                            const undoneCount = weekTasks.filter(t => !t.isDone).length;
                            const collapsed = isWeekCollapsed(week, wIdx);
                            const weekState = isWeekCurrent(week) ? 'ТЕКУЩАЯ' : isWeekPast(week) ? 'ПРОШЛА' : 'СЛЕДУЮЩАЯ';

                            const startDt = new Date(week[0]);
                            const endDt = new Date(week[week.length - 1]);
                            const dateRangeLabel = `${startDt.getDate()} ${months[startDt.getMonth()]} — ${endDt.getDate()} ${months[endDt.getMonth()]}`;

                            return (
                                <section key={wIdx} className="transition-all">
                                    <div className={`flex flex-col lg:flex-row justify-between items-start lg:items-center text-white rounded-2xl p-4 mb-4 shadow-md gap-3 ${
                                        isWeekCurrent(week)
                                            ? (viewMode === 'work' ? 'bg-emerald-700 ring-2 ring-emerald-400' : 'bg-blue-700 dark:bg-sky-700 ring-2 ring-blue-400')
                                            : (viewMode === 'work' ? 'bg-emerald-800/90' : 'bg-slate-700 dark:bg-zinc-800')

                                            >

                                                <span className="text-sm">Неделя {wIdx + 1}</span>
                                                <span className="text-[11px] font-normal text-white/80 lowercase">({dateRangeLabel})</span>
                                                <span className={`rounded-md px-2 py-0.5 text-[9px] font-black ${isWeekCurrent(week) ? 'bg-amber-400 text-slate-900 shadow' : 'bg-white/15'}`}>
                                                    {weekState}

                                            </button>

                                            {collapsed && undoneCount > 0 && (
                                                <span className="text-[10px] bg-white/20 px-2 py-0.5 rounded text-white font-semibold">
                                                    {undoneCount} активных
                                                </span>

                                            {weekTasks.filter(t => t.isUrgent && !t.isDone).length > 0 && (
                                                <span className="text-[10px] bg-rose-500 px-2 py-0.5 rounded text-white font-black animate-pulse">

                                                </span>

                                        </div>

                                        {/* Super Tools for the Week */}
                                        <div className="flex flex-wrap items-center gap-2 w-full lg:w-auto justify-between lg:justify-end">
                                            <div className="flex items-center gap-1.5">

                                    >
                                        Очистить
                                    </button>
                                    <button
                                        onClick={() => setEditingTimeDate(null)}
                                        className="flex-1 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-xs shadow-lg transition-all"
                                    >
                                        Готово
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Week Templates Modal */}
                    {templateModalWeek && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white dark:bg-zinc-800 border border-slate-300 dark:border-zinc-700 p-6 rounded-3xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto space-y-6">
                                <div className="flex justify-between items-center border-b border-slate-200 dark:border-zinc-700 pb-3">
                                    <div>
                                        <h3 className="text-lg font-bold text-slate-800 dark:text-zinc-100 flex items-center gap-2">
                                            📋 Шаблоны недель
                                        </h3>
                                        <p className="text-xs text-slate-500 dark:text-zinc-400">
                                            Быстрое авто-заполнение задач и рабочих часов
                                        </p>
                                    </div>
                                    <button onClick={() => setTemplateModalWeek(null)} className="text-slate-400 hover:text-slate-600 text-lg font-black">✕</button>
                                </div>

                                {/* Save current week as template */}
                                <div className="space-y-3 bg-slate-50 dark:bg-zinc-700/40 p-4 rounded-2xl border border-slate-200 dark:border-zinc-700">
                                    <h4 className="font-bold text-xs uppercase tracking-wider text-slate-600 dark:text-zinc-300">
                                        💾 Сохранить эту неделю как шаблон
                                    </h4>
                                    <div className="flex gap-2">
                                        <input
                                            type="text"
                                            placeholder="Название (напр. Учеба: Четная неделя)..."
                                            value={newTemplateName}
                                            onChange={e => setNewTemplateName(e.target.value)}
                                            className="flex-1 text-xs bg-white dark:bg-zinc-800 border border-slate-300 dark:border-zinc-600 rounded-xl px-3 py-2 outline-none focus:border-blue-500"
                                        />
                                        <button
                                            onClick={() => saveCurrentWeekAsTemplate(templateModalWeek)}
                                            className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow"
                                        >
                                            Сохранить
                                        </button>
                                    </div>
                                </div>

                                {/* Available templates */}
                                <div className="space-y-3">
                                    <h4 className="font-bold text-xs uppercase tracking-wider text-slate-500 dark:text-zinc-400">
                                        Доступные шаблоны для применения
                                    </h4>
                                    {(data.templates || []).map(tpl => (
                                        <div key={tpl.id} className="p-4 rounded-2xl bg-white dark:bg-zinc-700/60 border border-slate-200 dark:border-zinc-600 flex items-center justify-between gap-3 shadow-sm hover:border-blue-400 transition-all">
                                            <div>
                                                <h5 className="font-bold text-sm text-slate-800 dark:text-zinc-100">{tpl.name}</h5>
                                                <p className="text-[11px] text-slate-500 dark:text-zinc-400 mt-0.5">
                                                    {tpl.workHours ? '⏰ Рабочие часы 5/2' : '📝 Набор задач на неделю'}
                                                </p>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <button
                                                    onClick={() => applyTemplateToWeek(tpl, templateModalWeek)}
                                                    className="px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs shadow transition-all"
                                                >
                                                    Применить
                                                </button>
                                                {tpl.id.startsWith('tpl-') && (
                                                    <button
                                                        onClick={() => deleteTemplate(tpl.id)}
                                                        className="p-2 text-slate-400 hover:text-rose-500 text-xs font-black"
                                                        title="Удалить шаблон"
                                                    >
                                                        ✕
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Settings Modal */}
                    {isSettingsOpen && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4 z-[100]">
                            <div className="bg-white dark:bg-zinc-800 border border-slate-300 dark:border-zinc-700 p-6 rounded-3xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto space-y-6">
                                <div className="flex justify-between items-center border-b border-slate-200 dark:border-zinc-700 pb-3">
                                    <div>
                                        <h3 className="text-lg font-bold text-slate-800 dark:text-zinc-100 flex items-center gap-2">
                                            ⚙️ Настройки и Синхронизация
                                        </h3>
                                        <span className="text-[10px] font-mono text-slate-400">Версия приложения: v{APP_VERSION}</span>
                                    </div>
                                    <button onClick={() => setIsSettingsOpen(false)} className="text-slate-400 hover:text-slate-600 text-lg font-black">✕</button>
                                </div>

                                <div className="space-y-3 bg-slate-50 dark:bg-zinc-700/40 p-4 rounded-2xl border border-slate-200 dark:border-zinc-700">
                                    <h4 className="font-bold text-xs uppercase tracking-wider text-slate-600 dark:text-zinc-300 flex items-center gap-1.5">
                                        ☁️ Облачная синхронизация (GitHub Gist)
                                    </h4>
                                    <p className="text-[11px] text-slate-500 dark:text-zinc-400">
                                        Позволяет синхронизировать задачи и часы между телефоном и компьютером в реальном времени.
                                    </p>

                                    <div>
                                        <label className="text-[10px] font-bold uppercase text-slate-500 dark:text-zinc-400">Gist ID</label>
                                        <input
                                            type="text"
                                            className="w-full text-xs font-mono bg-white dark:bg-zinc-800 border border-slate-300 dark:border-zinc-600 rounded-xl px-3 py-2 outline-none focus:border-blue-500"
                                            value={gistId}
                                            onChange={e => {
                                                setGistId(e.target.value);
                                                localStorage.setItem('tracker_gist_id', e.target.value);
                                            }}
                                        />
                                    </div>

                                    <div>
                                        <label className="text-[10px] font-bold uppercase text-slate-500 dark:text-zinc-400">GitHub Personal Access Token</label>
                                        <input
                                            type="password"
                                            placeholder="ghp_..."
                                            className="w-full text-xs font-mono bg-white dark:bg-zinc-800 border border-slate-300 dark:border-zinc-600 rounded-xl px-3 py-2 outline-none focus:border-blue-500"
                                            value={githubToken}
                                            onChange={e => {
                                                setGithubToken(e.target.value);
                                                localStorage.setItem('tracker_gh_token', e.target.value);
                                            }}
                                        />
                                    </div>

                                    <div className="flex flex-col sm:flex-row gap-2 pt-1">
                                        <button
                                            onClick={loadData}
                                            className="flex-1 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs shadow"
                                        >
                                            🔄 Проверить синхронизацию
                                        </button>
                                        <button
                                            onClick={copyMobileLink}
                                            title="Скопировать ссылку со всеми настройками для открытия на телефоне"
                                            className="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow"
                                        >
                                            {copySuccess ? '✓ Скопировано!' : '📱 Ссылка для телефона'}
                                        </button>
                                    </div>
                                </div>

                                <div className="space-y-3 bg-slate-50 dark:bg-zinc-700/40 p-4 rounded-2xl border border-slate-200 dark:border-zinc-700">
                                    <h4 className="font-bold text-xs uppercase tracking-wider text-slate-600 dark:text-zinc-300 flex items-center gap-1.5">
                                        🔒 Сквозное шифрование (AES-256)
                                    </h4>
                                    <p className="text-[11px] text-slate-500 dark:text-zinc-400">
                                        Защищает ваши задачи мастер-паролем или PIN-кодом. В облаке и на устройствах данные хранятся в зашифрованном виде.
                                    </p>
                                    
                                    {isEncrypted ? (
                                        <div className="space-y-3">
                                            <div className="p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded-xl flex items-center justify-between">
                                                <span className="text-xs font-bold text-emerald-700 dark:text-emerald-300 flex items-center gap-1.5">
                                                    <span>🛡️</span> Шифрование активно
                                                </span>
                                                <button
                                                    onClick={handleDisableEncryption}
                                                    className="px-3 py-1 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-lg text-[10px]"
                                                >
                                                    Отключить
                                                </button>
                                            </div>
                                            <div className="flex gap-2">
                                                <input
                                                    type="password"
                                                    placeholder="Новый мастер-пароль / PIN..."
                                                    value={newPassInput}
                                                    onChange={e => setNewPassInput(e.target.value)}
                                                    className="flex-1 text-xs bg-white dark:bg-zinc-800 border border-slate-300 dark:border-zinc-600 rounded-xl px-3 py-2 outline-none"
                                                />
                                                <button
                                                    onClick={handleEnableEncryption}
                                                    className="px-4 py-2 bg-slate-700 hover:bg-slate-800 text-white font-bold rounded-xl text-xs"
                                                >
                                                    Сменить пароль
                                                </button>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="space-y-2">
                                            <div className="flex gap-2">
                                                <input
                                                    type="password"
                                                    placeholder="Задайте мастер-пароль или PIN..."
                                                    value={newPassInput}
                                                    onChange={e => setNewPassInput(e.target.value)}
                                                    className="flex-1 text-xs bg-white dark:bg-zinc-800 border border-slate-300 dark:border-zinc-600 rounded-xl px-3 py-2 outline-none"
                                                />
                                                <button
                                                    onClick={handleEnableEncryption}
                                                    className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs"
                                                >
                                                    Зашифровать
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {/* Cache & App Control */}
                                <div className="space-y-3 bg-slate-50 dark:bg-zinc-700/40 p-4 rounded-2xl border border-slate-200 dark:border-zinc-700">
                                    <h4 className="font-bold text-xs uppercase tracking-wider text-slate-600 dark:text-zinc-300 flex items-center gap-1.5">
                                        🧹 Очистка кеша и обновление
                                    </h4>
                                    <p className="text-[11px] text-slate-500 dark:text-zinc-400">
                                        Если после обновления на сайте не отображаются новые кнопки или функции, нажмите очистить кеш:
                                    </p>
                                    <div className="flex flex-col sm:flex-row gap-2">
                                        <button
                                            onClick={forceRefreshCache}
                                            className="flex-1 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs flex items-center justify-center gap-1.5 shadow"
                                        >
                                            <span>🔄 Очистить кеш и обновить</span>
                                        </button>
                                        <button
                                            onClick={() => {
                                                if (confirm('Сбросить локальные настройки (токены, пароли) на этом устройстве? (Данные в облаке Gist останутся нетронутыми)')) {
                                                    localStorage.clear();
                                                    sessionStorage.clear();
                                                    forceRefreshCache();
                                                }
                                            }}
                                            className="py-2.5 px-3 bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300 hover:bg-rose-100 font-bold rounded-xl text-xs"
                                        >
                                            🗑️ Сбросить всё
                                        </button>
                                    </div>
                                </div>

                                <div className="space-y-3 bg-slate-50 dark:bg-zinc-700/40 p-4 rounded-2xl border border-slate-200 dark:border-zinc-700">
                                    <h4 className="font-bold text-xs uppercase tracking-wider text-slate-600 dark:text-zinc-300 flex items-center gap-1.5">
                                        💾 Резервные копии
                                    </h4>
                                    <div className="flex gap-2">
                                        <button
                                            onClick={exportBackup}
                                            className="flex-1 py-2.5 bg-slate-200 dark:bg-zinc-700 hover:bg-slate-300 text-slate-800 dark:text-zinc-200 font-bold rounded-xl text-xs flex items-center justify-center gap-1"
                                        >
                                            📥 Скачать .json
                                        </button>
                                        <label className="flex-1 py-2.5 bg-slate-200 dark:bg-zinc-700 hover:bg-slate-300 text-slate-800 dark:text-zinc-200 font-bold rounded-xl text-xs flex items-center justify-center gap-1 cursor-pointer">
                                            📤 Загрузить .json
                                            <input type="file" accept=".json" onChange={importBackup} className="hidden" />
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
